<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Soft Shadow -->
    <filter id="circle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2b1d" flood-opacity="0.25" />
    </filter>

    <!-- Document Subtle Soft Shadow -->
    <filter id="doc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1a12" flood-opacity="0.18" />
    </filter>

    <!-- Circle Green Gradient -->
    <linearGradient id="green-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EBA8A" />
      <stop offset="100%" stop-color="#2D8C62" />
    </linearGradient>

    <!-- Badge Green Gradient -->
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D8C62" />
      <stop offset="100%" stop-color="#1B5E3F" />
    </linearGradient>
  </defs>

  <!-- Green Background Circle with Shadow -->
  <circle cx="256" cy="256" r="210" fill="url(#green-bg)" filter="url(#circle-shadow)" />

  <!-- Document Group with Shadow -->
  <g filter="url(#doc-shadow)">
    <!-- White Document Body -->
    <path d="M 160,110 
             H 310 
             L 360,160 
             V 382 
             A 18,18 0 0,1 342,400 
             H 178 
             A 18,18 0 0,1 160,382 
             Z" fill="#FFFFFF" />

    <!-- Folded Corner -->
    <path d="M 310,110 
             V 148 
             A 12,12 0 0,0 322,160 
             H 360 
             Z" fill="#E2F0D9" />

    <!-- Simple Document Content Lines -->
    <!-- Header Lines -->
    <rect x="195" y="165" width="65" height="10" rx="5" fill="#2D8C62" />
    <rect x="195" y="185" width="45" height="8" rx="4" fill="#A3D9C9" />

    <!-- Main Content Bars -->
    <rect x="195" y="225" width="122" height="14" rx="7" fill="#2D8C62" />
    <rect x="195" y="255" width="122" height="14" rx="7" fill="#2D8C62" />
    <rect x="195" y="285" width="122" height="14" rx="7" fill="#2D8C62" />

    <!-- Bottom Summary Line -->
    <rect x="195" y="325" width="80" height="10" rx="5" fill="#A3D9C9" />

    <!-- Checkmark Badge -->
    <g transform="translate(325, 155)">
      <!-- Badge Outer Circle -->
      <circle cx="0" cy="0" r="28" fill="url(#badge-bg)" stroke="#FFFFFF" stroke-width="4" />
      <!-- Checkmark -->
      <path d="M -9,0 L -3,6 L 9,-6" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>